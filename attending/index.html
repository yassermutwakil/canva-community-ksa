<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خليني أشوفكم · Canva Community Saudi Arabia</title>
<meta name="description" content="Make your own Canva World Tour share card and post that you are attending. اصنع بطاقتك وشارك إنك حاضر.">
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
:root{
  --bg:#ffffff; --bg-soft:#f3f4f7; --surface:#ffffff; --fg:#0f1015; --fg-soft:#404f6d; --fg-mute:#6b7488;
  --line:#e3e5ec; --purple:#8b3dff; --purple-ink:#7d2ae8; --tint:#efe5ff; --cyan:#00c4cc;
  --night:#0f1015; --pill:9999px;
  --f-en:"Canva Sans Display",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-ar:"Graphik Arabic","Canva Sans Display",Tahoma,sans-serif;
  --shadow:0 18px 40px rgba(24,44,89,.14);
  --top:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0d12; --bg-soft:#15161e; --surface:#181922; --fg:#f4f5f8; --fg-soft:#b9bfce; --fg-mute:#8f97ab;
  --line:#282a37; --purple:#a77bff; --purple-ink:#b48dff; --tint:#251b40;
  --shadow:0 18px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d12; --bg-soft:#15161e; --surface:#181922; --fg:#f4f5f8; --fg-soft:#b9bfce; --fg-mute:#8f97ab;
  --line:#282a37; --purple:#a77bff; --purple-ink:#b48dff; --tint:#251b40;
  --shadow:0 18px 40px rgba(0,0,0,.45); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-en);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-family:var(--f-ar);line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--purple);outline-offset:2px;border-radius:8px}
.ic{width:18px;height:18px;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:10px;height:var(--top);padding-inline:max(16px,env(safe-area-inset-left,0px));max-width:1280px;margin-inline:auto}
.brandmark{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-en);font-size:15px;letter-spacing:-.02em;direction:ltr;white-space:nowrap}
.brandmark img{width:28px;height:28px;border-radius:8px}
.brandmark b{font-weight:800}.brandmark span{font-weight:500}
.top .sp{margin-inline-start:auto}
.ghost{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:var(--pill);border:0;background:var(--bg-soft);font-size:13.5px;font-weight:600;cursor:pointer}
.ghost:hover{background:var(--tint);color:var(--purple-ink)}

/* ---- app: one screen on desktop ---- */
.app{max-width:1280px;margin-inline:auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 16px;
     display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.preview-col{display:flex;flex-direction:column;align-items:center}
.stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:var(--bg-soft);
       aspect-ratio:4/5;height:calc(100vh - var(--top) - 20px);height:calc(100dvh - var(--top) - 20px);max-height:860px;min-height:380px}
#card{width:100%;height:100%;display:block;touch-action:none}
#card.grab{cursor:grab}#card.grabbing{cursor:grabbing}
.stage .drag{position:absolute;inset-inline-start:12px;bottom:12px;background:rgba(15,16,21,.62);color:#fff;padding:6px 12px;border-radius:var(--pill);font-size:12px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .3s}
.stage .drag.on{opacity:1}
.stage .addph{position:absolute;top:10px;inset-inline-end:10px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--pill);border:0;background:rgba(15,16,21,.72);color:#fff;font-size:12.5px;font-weight:650;cursor:pointer}
.stage .addph .ic{width:15px;height:15px}

/* ---- heading ---- */
.head h1{margin:0;font-size:clamp(22px,2.2vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
html[lang="ar"] .head h1{letter-spacing:0;font-weight:600;line-height:1.35}
.head p{margin:4px 0 0;color:var(--fg-mute);font-size:14px}
.eyebrow{display:block;font-size:12.5px;font-weight:700;color:var(--purple-ink);margin-bottom:4px}

/* ---- steps ---- */
.step{display:flex;flex-direction:column;gap:8px}
.lab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--fg-soft)}
.lab .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--purple);color:#fff;font-size:11.5px;font-weight:700;font-family:var(--f-en)}
.lab small{font-weight:500;color:var(--fg-mute)}

.evs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ev{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;min-width:0;position:relative;transition:border-color .2s,background .2s}
.ev[aria-pressed="true"]{border-color:var(--purple);background:var(--tint)}
:root[data-theme="dark"] .ev[aria-pressed="true"],
html:not([data-theme="light"]) .ev[aria-pressed="true"]{background:color-mix(in srgb,var(--purple) 16%,transparent)}
.ev b{display:flex;align-items:center;gap:7px;font-family:var(--f-en);font-weight:700;font-size:13.5px;letter-spacing:-.01em;line-height:1.25;max-width:100%}
.ev b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.ev .dot{width:9px;height:9px;border-radius:50%;flex:none}
.ev small{display:block;color:var(--fg-mute);font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev .past{display:inline-block;margin-inline-start:4px;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:var(--pill);background:var(--bg-soft);color:var(--fg-mute);vertical-align:1px}
.ev .venue{}

.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inp{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;transition:border-color .2s}
.inp:focus{outline:0;border-color:var(--purple)}

.photo-row{display:flex;align-items:center;gap:8px}
.filebtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:var(--pill);border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.filebtn:hover{border-color:var(--purple)}
.filebtn.x{padding:0 12px;color:var(--fg-mute)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.zoom{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.zoom svg{width:16px;height:16px;flex:none;color:var(--fg-mute)}
.rng{flex:1;min-width:0;accent-color:var(--purple);direction:ltr}
.hint{font-size:12px;color:var(--fg-mute);margin:0;display:flex;align-items:center;gap:6px}
.hint svg{width:13px;height:13px;flex:none;color:var(--cyan)}

/* ---- actions ---- */
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:var(--pill);font-weight:650;font-size:15px;border:0;cursor:pointer;white-space:nowrap;transition:background .2s}
.btn-primary{background:var(--purple);color:#fff;flex:1}
.btn-primary:hover{background:var(--purple-ink)}
.btn-share{background:var(--fg);color:var(--bg);flex:1}
.nets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.net{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:650;cursor:pointer;transition:border-color .2s,color .2s}
.net svg{width:18px;height:18px;flex:none}
.net.li:hover{border-color:#0a66c2;color:#0a66c2}
.net.x:hover{border-color:var(--fg)}
.net.ig:hover{border-color:#d946d0;color:#d946d0}
.share-h{font-size:12.5px;color:var(--fg-mute);margin:0}

.cap{border-radius:12px;background:var(--bg-soft)}
.cap summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none;font-size:13px;font-weight:650;color:var(--fg-soft)}
.cap summary::-webkit-details-marker{display:none}
.cap summary .chev{width:14px;height:14px;transition:transform .2s}
.cap[open] summary .chev{transform:rotate(180deg)}
.cap .copy{margin-inline-start:auto;height:30px;padding:0 12px;border-radius:var(--pill);border:0;background:var(--tint);color:var(--purple-ink);font-size:12.5px;font-weight:650;cursor:pointer}
.cap pre{margin:0;padding:0 14px 12px;font:inherit;font-size:13px;line-height:1.6;color:var(--fg-soft);white-space:pre-wrap;word-break:break-word;unicode-bidi:plaintext;text-align:start;max-height:130px;overflow:auto}

.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-mute)}
.foot a{color:var(--purple-ink);font-weight:650}
.reg{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--purple-ink)}
.reg .ic{width:15px;height:15px}

.toast{position:fixed;inset-inline:16px;bottom:18px;margin-inline:auto;max-width:520px;z-index:70;background:var(--night);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:550;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:none}

/* short laptop screens: tighten so everything stays in one frame */
@media (min-width:901px) and (max-height:760px){
  .panel{gap:10px}.head p{display:none}
  .inp{height:42px}.btn{height:46px}.net{height:40px}.filebtn{height:38px}
}

/* ---- phones & tablets: everything in one screen, actions pinned ---- */
@media (max-width:900px){
  :root{--top:50px}
  .top{gap:8px}
  .brandmark{font-size:14px}.brandmark img{width:26px;height:26px}
  .ghost{height:32px;padding:0 12px;font-size:12.5px}
  #backBtn{display:none}
  .app{grid-template-columns:1fr;gap:10px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .preview-col{order:-1}
  .stage{height:clamp(170px,calc(100svh - 405px),50svh);width:auto;min-height:0;max-height:none;border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
  .head,.hint,.lab,#labPhotoStep:not(.has){display:none}
  .panel{gap:10px}
  .step{gap:6px}
  .evs{gap:6px}
  .ev{padding:8px 9px;border-radius:12px;justify-content:center}
  .ev b{align-items:flex-start;font-size:12.5px}
  .ev b span{white-space:normal;overflow:visible;line-height:1.2}
  .ev .dot{margin-top:4px;width:8px;height:8px}
  .ev small{font-size:11px}
  .ev .venue{display:none}
  .inp{height:44px;border-radius:11px;font-size:16px}
  .two{gap:6px}
  .filebtn{height:38px;font-size:13px}
  .nets{gap:6px}.net{height:40px;border-radius:11px}
  .net span{display:none}
  .stage .addph{top:auto;bottom:8px;inset-inline-end:8px;height:32px;padding:0 10px;font-size:12px;background:rgba(15,16,21,.78)}
  .app:has(#labPhotoStep.has) .addph{display:none}
  .stage .drag{inset-inline-start:50%;bottom:auto;top:8px;transform:translateX(-50%);white-space:nowrap}
  [dir="rtl"] .stage .drag{transform:translateX(50%)}
  .app:has(#labPhotoStep.has) .stage{height:clamp(165px,calc(100svh - 450px),46svh)}
  .cap summary{padding:8px 12px}
  .actions{position:fixed;inset-inline:0;bottom:0;z-index:60;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .btn{height:48px}
  .foot{font-size:12px}
}
@media (max-width:400px){ .ev b{font-size:12px} }
/* very short phones: the caption is still copied by every share button */
@media (max-width:900px) and (max-height:620px){ .cap{display:none} .foot{font-size:11.5px} }
</style>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header class="top">
  <a class="brandmark" href="../" aria-label="Canva Community Saudi Arabia">
    <img src="../assets/logo.png" alt=""><span><b>Canva</b> Community <b>SA</b></span>
  </a>
  <span class="sp"></span>
  <button class="ghost" id="langBtn" type="button"></button>
  <a class="ghost" href="../" id="backBtn"></a>
</header>

<main class="app">
  <section class="panel">
    <div class="head">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>

    <div class="step">
      <span class="lab"><span class="n">1</span><span id="labEvent"></span></span>
      <div class="evs" id="evs"></div>
    </div>

    <div class="step">
      <span class="lab"><span class="n">2</span><span id="labInfo"></span></span>
      <div class="two">
        <input class="inp" id="nm" maxlength="34" autocomplete="name" aria-label="Name">
        <input class="inp" id="rl" maxlength="46" autocomplete="organization-title" aria-label="Role">
      </div>
    </div>

    <div class="step" id="labPhotoStep">
      <span class="lab"><span class="n">3</span><span id="labPhoto"></span></span>
      <div class="photo-row">
        <label class="filebtn" for="ph">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5m0 0L8 9m4-4 4 4M5 18.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="labPhotoBtn"></span>
        </label>
        <input type="file" id="ph" accept="image/*">
        <div class="zoom" id="zoomWrap" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4M8.5 11h5M11 8.5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input class="rng" type="range" id="zoom" min="100" max="260" value="100" aria-label="Zoom">
        </div>
        <button class="filebtn x" id="clearPh" type="button" hidden></button>
      </div>
      <p class="hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11V8a6 6 0 1 1 12 0v3M5 11h14v9H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span id="privacy"></span>
      </p>
    </div>

    <div class="step">
      <span class="lab"><span class="n">4</span><span id="labShareH"></span></span>
      <div class="actions">
        <button class="btn btn-primary" id="dl" type="button">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="labDl"></span>
        </button>
        <button class="btn btn-share" id="shareBtn" type="button" hidden>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4M5 14v5.5h14V14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="labShare"></span>
        </button>
      </div>
      <div class="nets">
        <button class="net li" type="button" data-net="li">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5v8M6.5 6.5v.01M10.5 17.5v-4.5a2.5 2.5 0 0 1 5 0v4.5M10.5 9.5v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>LinkedIn</span>
        </button>
        <button class="net x" type="button" data-net="x">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l14 16M19 4L5 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span>X</span>
        </button>
        <button class="net ig" type="button" data-net="ig">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="7" r="1" fill="currentColor"/></svg>
          <span>Instagram</span>
        </button>
      </div>
      <details class="cap">
        <summary>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="labCap"></span>
          <button class="copy" id="copyBtn" type="button"></button>
        </summary>
        <pre id="capText"></pre>
      </details>
    </div>

    <div class="foot">
      <a class="reg" id="reg" target="_blank" rel="noopener"><span id="labReg"></span>
        <svg class="ic flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <span id="note"></span>
    </div>
  </section>

  <div class="preview-col">
    <div class="stage">
      <canvas id="card" width="1080" height="1350" role="img"></canvas>
      <span class="drag" id="dragHint"></span>
      <button class="addph" id="addPh" type="button">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3V19H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span id="labAddPh"></span>
      </button>
    </div>
  </div>
</main>

<script>

/* =======================================================================
   Canva World Tour · attendee share card
   Everything happens in this browser: the photo is read with FileReader,
   drawn straight to a canvas, and never uploaded anywhere.
   ======================================================================= */

/* ---------- copy ---------- */
const COPY = {
  eyebrow:  ['Canva World Tour · Jeddah', 'Canva World Tour · جدة'],
  title:    ['Tell everyone you’re coming.', 'عرّف الناس إنك جاي.'],
  sub:      ['4 quick steps. Your card updates live.', '٤ خطوات سريعة، وبطاقتك تتحدث مباشرة.'],
  labInfo:  ['Your name', 'اسمك'],
  rolePh:   ['Job title or company (optional)', 'مسماك أو شركتك (اختياري)'],
  labEvent: ['Which session?', 'أي لقاء؟'],
  labName:  ['Your name', 'اسمك'],
  labRole:  ['Job title or company', 'مسماك الوظيفي أو شركتك'],
  optional: ['optional', 'اختياري'],
  labPhoto: ['Your photo', 'صورتك'],
  photoBtn: ['Choose a photo', 'اختر صورة'],
  photoOff: ['Remove', 'احذف'],
  addPh:    ['Add your photo', 'أضف صورتك'],
  changePh: ['Change photo', 'غيّر الصورة'],
  labZoom:  ['Zoom', 'التكبير'],
  privacy:  ['Your photo stays on this device. Nothing is uploaded.', 'صورتك تبقى على جهازك، ولا يتم رفع أي شيء.'],
  dl:       ['Download card', 'حمّل البطاقة'],
  reg:      ['Register on Luma', 'سجّل على Luma'],
  drag:     ['Drag to reposition', 'اسحب لتحريك الصورة'],
  note:     ['Tag us ', 'منشنونا '],
  namePh:   ['Write your name', 'اكتب اسمك'],
  back:     ['Back to the site', 'رجوع للموقع'],
  attending:['I’m attending', 'خليني أشوفكم في'],
  attended: ['I was there', 'كنت معكم في'],
  firstKsa: ['First time in Saudi Arabia', 'لأول مرة في السعودية'],
  online:   ['Online', 'أونلاين'],
  past:     ['Done', 'انتهى'],
  me:       ['You', 'أنا'],
  shareH:   ['Save & share', 'حمّل وشارك'],
  shareHs:  ['the caption is written for you', 'النص مكتوب لك'],
  share:    ['Share', 'شارك'],
  capLab:   ['Ready caption', 'النص الجاهز'],
  copy:     ['Copy', 'انسخ'],
  copied:   ['Caption copied.', 'نسخنا النص.'],
  copyFail: ['Could not copy — select the text and copy it yourself.', 'ما قدرنا ننسخ — ظلّل النص وانسخه بنفسك.'],
  tLi:      ['Image saved and caption copied. Paste it in LinkedIn and attach the image.', 'حمّلنا الصورة ونسخنا النص. الصقه في LinkedIn وأرفق الصورة.'],

/* ---------- canvas helpers ---------- */
const W = 1080, CH = 1350;
const ctx = $('#card').getContext('2d');

function face(px, weight, arabic){
  return `${weight} ${px}px ${arabic ? '"Graphik Arabic","Canva Sans Display"' : '"Canva Sans Display","Graphik Arabic"'}, sans-serif`;
}
function setText(px, weight, arabic, align){
  ctx.font = face(px, weight, arabic);
  ctx.direction = arabic ? 'rtl' : 'ltr';
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
}
const SPARK = new Path2D('M12 1.5c.7 5.2 2.8 8.3 10.5 10.5-7.7 2.2-9.8 5.3-10.5 10.5-.7-5.2-2.8-8.3-10.5-10.5C9.2 9.8 11.3 6.7 12 1.5z');
function spark(x, y, size, alpha){
  ctx.save();
  ctx.translate(x, y); ctx.scale(size / 24, size / 24); ctx.translate(-12, -12);
  ctx.globalAlpha = alpha; ctx.fillStyle = '#fff'; ctx.fill(SPARK);
  ctx.restore();
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fitText(text, px, weight, arabic, maxW, minPx){
  let size = px;
  while (size > minPx) {
    ctx.font = face(size, weight, arabic);
    if (ctx.measureText(text).width <= maxW) break;
    size -= 2;
  }
  return size;
}

/* ---------- the card ---------- */
function cursorTag(x, y, label, col, mirror){
  const ARROW = new Path2D('M4 2.5l6.8 18.2 2.5-7.7 7.7-2.6z');
  const k = 38 / 24;
  ctx.save();
  ctx.translate(x, y);
  if (mirror) ctx.scale(-1, 1);
  ctx.scale(k, k);
  ctx.fillStyle = col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  ctx.fill(ARROW); ctx.stroke(ARROW);
  ctx.restore();

  const ar = isAr(label);
  setText(28, ar ? 600 : 700, ar, 'center');
  const w = ctx.measureText(label).width + 44, h = 52;
  const bx = mirror ? x - 24 - w : x + 24;
  ctx.save();
  ctx.shadowColor = 'rgba(16,24,64,.28)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 7;
  ctx.fillStyle = col;
  roundRect(bx, y + 28, w, h, 15);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  setText(28, ar ? 600 : 700, ar, 'center');
  ctx.fillText(label, bx + w / 2, y + 28 + 35);
}

let rafId = 0;
function draw(){
  if (!READY || rafId) return;
  rafId = requestAnimationFrame(() => { rafId = 0; drawNow(); });
}
function flushDraw(){
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  if (READY) drawNow();
}
function drawNow(){
  const e = ev(), rtl = LANG === 'ar', mid = W / 2;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, CH);

  /* white at the top, the tour gradient underneath */
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(.42, '#ffffff');
  g.addColorStop(.50, '#e1f9fd');
  g.addColorStop(.58, '#a3e9f4');
  g.addColorStop(.66, '#55c6d7');
  g.addColorStop(.73, '#2a94c6');
  g.addColorStop(.80, '#3966d9');
  g.addColorStop(.88, '#5143ef');
  g.addColorStop(1, '#722ffb');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, CH);

  /* the real Canva World Tour lockup, centred */
  if (LOCKUP) {
    const lh = 56, lw = lh * (LOCKUP.width / LOCKUP.height);
    ctx.drawImage(LOCKUP, mid - lw / 2, 92, lw, lh);
  }

  /* eyebrow */
  const eb = T('firstKsa'), ebAr = isAr(eb);
  setText(25, 600, ebAr, 'center');
  if (!ebAr) try { ctx.letterSpacing = '0.16em'; } catch(_){}
  ctx.fillStyle = '#404f6d';
  ctx.fillText(ebAr ? eb : eb.toUpperCase(), mid, 234);
  try { ctx.letterSpacing = '0px'; } catch(_){}

  /* headline */
  const head = isPast(e) ? T('attended') : T('attending');
  const headAr = isAr(head);
  const hs = fitText(head, 112, headAr ? 600 : 700, headAr, W - 150, 60);
  setText(hs, headAr ? 600 : 700, headAr, 'center');
  ctx.fillStyle = '#3c3ef0';
  ctx.fillText(head, mid, 372);
  const headInk = 372 + ctx.measureText(head).actualBoundingBoxDescent;

  /* size the event title now, so the photo can be centred on what is really left */
  const ts = fitText(e.title, 56, 700, false, W - 150, 32);
  setText(ts, 700, false, 'center');
  const titleInk = 975 - ctx.measureText(e.title).actualBoundingBoxAscent;

  /* ---- the person, optically centred between the headline and the event ---- */
  const CX = mid;
  const R = Math.max(150, Math.min(212, Math.floor((titleInk - headInk) / 2) - 52));
  const CY = Math.round((headInk + titleInk) / 2);
  let rg = ctx.createRadialGradient(CX, CY, R * .55, CX, CY, R * 1.5);
  rg.addColorStop(0, 'rgba(255,255,255,.7)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(CX, CY, R * 1.5, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.closePath();
  const dg = ctx.createLinearGradient(CX - R, CY - R, CX + R, CY + R);
  dg.addColorStop(0, '#d9f6fc'); dg.addColorStop(.52, '#ffffff'); dg.addColorStop(1, '#cfeefb');
  ctx.fillStyle = dg; ctx.fill();
  ctx.clip();
  if (S.img) {
    const im = S.img;
    const base = (R * 2) / Math.min(im.width, im.height);
    const sc = base * S.zoom;
    const dw = im.width * sc, dh = im.height * sc;
    ctx.drawImage(im, CX - dw / 2 + S.ox, CY - dh / 2 + S.oy, dw, dh);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,.96)';
    ctx.beginPath(); ctx.arc(CX, CY - 46, 54, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(CX, CY + 128, 108, Math.PI, 0); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(CX, CY + 2, R + 3, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  cursorTag(rtl ? CX - R * .62 : CX + R * .62, CY + R * .62, T('me'), '#ff6105', rtl);

  /* ---- the event ---- */
  setText(ts, 700, false, 'center');
  ctx.fillStyle = '#fff';
  ctx.fillText(e.title, mid, 975);

  const venue = e.format === 'online' ? T('online') : (LANG === 'ar' ? e.venue.ar : e.venue.en);
  const meta = fmtDate(e) + '  ·  ' + venue;
  const ms = fitText(meta, 30, 500, isAr(meta), W - 150, 20);
  setText(ms, 500, isAr(meta), 'center');
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillText(meta, mid, 1026);

  /* ---- the name, on a white pill ---- */
  const typed = S.name.trim();
  const name = typed || T('namePh');
  const nameAr = isAr(name);
  const ns = fitText(name, 44, nameAr ? 600 : 700, nameAr, W - 300, 26);
  setText(ns, nameAr ? 600 : 700, nameAr, 'center');
  const pw = Math.min(W - 150, ctx.measureText(name).width + 96), ph = 76;
  ctx.save();
  ctx.shadowColor = 'rgba(16,24,64,.22)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#fff';
  roundRect(mid - pw / 2, 1062, pw, ph, ph / 2);
  ctx.fill();
  ctx.restore();
  setText(ns, nameAr ? 600 : 700, nameAr, 'center');
  ctx.fillStyle = typed ? '#3c3ef0' : 'rgba(60,62,240,.45)';
  ctx.fillText(name, mid, 1062 + 51);

  if (S.role.trim()) {
    const roleAr = isAr(S.role);
    const rs = fitText(S.role.trim(), 29, 500, roleAr, W - 180, 19);
    setText(rs, 500, roleAr, 'center');
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.fillText(S.role.trim(), mid, 1176);
  }

  /* ---- who made it: the official Canva Community Saudi Arabia lockup ---- */
  if (LOGO) {
    const lw = 430, lh = lw * (LOGO.naturalHeight / LOGO.naturalWidth);
    ctx.drawImage(LOGO, mid - lw / 2, 1240, lw, lh);
  }

  setText(23, 600, false, 'center');
  ctx.direction = 'ltr';
  ctx.fillStyle = 'rgba(255,255,255,.62)';
  ctx.fillText('@canvacommunitysa', mid, 1305);

  const cap = document.getElementById('capText');
  if (cap && cap.closest('details').open) cap.textContent = caption();
}

/* photo */
$('#ph').addEventListener('change', ev2 => {

/* drag to reposition, in card pixels */
let dragging = false, lastX = 0, lastY = 0;
const cardEl = $('#card');
$('#addPh').addEventListener('click', () => $('#ph').click());
cardEl.addEventListener('click', () => { if (!S.img) $('#ph').click(); });
cardEl.addEventListener('pointerdown', e => {
  if (!S.img) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cardEl.setPointerCapture(e.pointerId);
  cardEl.classList.add('grabbing');
});
cardEl.addEventListener('pointermove', e => {
  if (!dragging) return;
  const k = W / cardEl.getBoundingClientRect().width;
  S.ox += (e.clientX - lastX) * k;
  S.oy += (e.clientY - lastY) * k;
  lastX = e.clientX; lastY = e.clientY;
  draw();
});
['pointerup','pointercancel'].forEach(t => cardEl.addEventListener(t, () => {
  dragging = false; cardEl.classList.remove('grabbing');
}));

/* text */
$('#nm').addEventListener('input', e => { S.name = e.target.value; draw(); });
$('#rl').addEventListener('input', e => { S.role = e.target.value; draw(); });
$('#evs').addEventListener('click', e => {

});

const fileName = () => {

  return `cwt-${ev().slug}-${who}.png`;

const pngBlob = () => { flushDraw(); return new Promise(r => cardEl.toBlob(r, 'image/png')); };
function saveBlob(b){

  const a = document.createElement('a');
  a.href = url; a.download = fileName();
  document.body.appendChild(a); a.click(); a.remove();

}

/* ---------- the caption, written so the post markets the community ---------- */
function siteUrl(){
  const o = location.origin;
  return /^https?:/.test(o) && !/localhost|127\.0\.0\.1|\[::1\]/.test(o) ? o + '/' : '';
}
function caption(){
  const e = ev(), ar = LANG === 'ar', past = isPast(e);
  const venue = e.format === 'online' ? T('online') : (ar ? e.venue.ar : e.venue.en);
  const when = fmtDate(e) + ' \u00b7 ' + venue;
  const next = EVENTS.filter(x => !isPast(x) && x.slug !== e.slug)[0];
  const site = siteUrl();
  const lines = [];

  if (ar) {
    lines.push(past
      ? `\u0633\u0639\u064a\u062f \u0625\u0646\u064a \u062d\u0636\u0631\u062a \u0641\u0639\u0627\u0644\u064a\u0629 ${e.title}\u060c \u0645\u0646 \u062c\u0648\u0644\u0629 Canva World Tour\u060c \u0648\u0644\u0623\u0648\u0644 \u0645\u0631\u0629 \u0641\u064a \u0627\u0644\u0633\u0639\u0648\u062f\u064a\u0629.`
      : `\u0633\u0639\u064a\u062f \u0625\u0646\u064a \u0631\u0627\u062d \u0623\u062d\u0636\u0631 \u0641\u0639\u0627\u0644\u064a\u0629 ${e.title}\u060c \u0645\u0646 \u062c\u0648\u0644\u0629 Canva World Tour\u060c \u0648\u0644\u0623\u0648\u0644 \u0645\u0631\u0629 \u0641\u064a \u0627\u0644\u0633\u0639\u0648\u062f\u064a\u0629.`);
    lines.push('');
    lines.push(when);
    lines.push('');
    if (!past && e.register) {
      lines.push(`\u0648\u0627\u0646\u062a \u0643\u0645\u0627\u0646 \u0641\u0631\u0635\u062a\u0643 \u062a\u0633\u062c\u0644 \u0627\u0644\u0622\u0646: ${e.register}`);
    } else if (next && next.register) {
      lines.push(`\u0648\u0627\u0646\u062a \u0643\u0645\u0627\u0646 \u0641\u0631\u0635\u062a\u0643 \u062a\u0633\u062c\u0644 \u0641\u064a ${next.title}: ${next.register}`);
    }
    if (site) lines.push(`\u0643\u0644 \u0627\u0644\u0644\u0642\u0627\u0621\u0627\u062a: ${site}`);
    lines.push('');
    lines.push('\u0645\u062c\u062a\u0645\u0639 Canva \u0641\u064a \u0627\u0644\u0633\u0639\u0648\u062f\u064a\u0629 \u00b7 @canvacommunitysa');
  } else {
    lines.push(past
      ? `Glad I was at ${e.title}, part of Canva World Tour, in Saudi Arabia for the first time.`
      : `Glad to be attending ${e.title}, part of Canva World Tour, in Saudi Arabia for the first time.`);
    lines.push('');
    lines.push(when);
    lines.push('');
    if (!past && e.register) lines.push(`Your turn \u2014 register now: ${e.register}`);
    else if (next && next.register) lines.push(`Your turn \u2014 register for ${next.title}: ${next.register}`);
    if (site) lines.push(`All the sessions: ${site}`);
    lines.push('');
    lines.push('Canva Community Saudi Arabia \u00b7 @canvacommunitysa');
  }
  lines.push('#CanvaWorldTour #CanvaCommunitySA');
  return lines.join('\n');
}

/* ---------- small helpers ---------- */
let toastT;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 5200);

async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch(_){}
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove(); return ok;
  } catch(_) { return false; }
}

    toast(T('tLi'));
  } else {
    window.open('https://www.instagram.com/', '_blank', 'noopener');
    toast(T('tIg'));
  }
});

$('#copyBtn').addEventListener('click', async () => {
  toast(await copyText(caption()) ? T('copied') : T('copyFail'));
});

/* ---------- boot ---------- */
function loadImg(src){
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}
(async function init(){
  // the events the site is actually showing
  try {
    const r = await fetch('../data/site-data.json', { cache:'no-store' });
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.events) && d.events.length) {
        EVENTS = d.events.map(e => ({
          slug:e.slug, title:e.title, color:e.color || '#8b3dff', format:e.format,
          start:e.start, end:e.end, venue:e.venue, register:e.register
        }));
      }
    }
  } catch(_){}
  EVENTS.sort((a, b) => new Date(a.start) - new Date(b.start));
  S.slug = (EVENTS.find(e => !isPast(e)) || EVENTS[0]).slug;

  [LOCKUP, LOGO] = await Promise.all([
    loadImg('../assets/cwt-lockup.png'),
    loadImg('../assets/cc-logo-long.svg')      // Yasser's official lockup, white paths
  ]);

  // the Arabic will fall back to Tahoma on canvas unless the faces are really loaded
  const want = [
    '600 132px "Graphik Arabic"', '600 58px "Graphik Arabic"', '500 33px "Graphik Arabic"',
    '600 27px "Graphik Arabic"', '600 25px "Graphik Arabic"',
    '700 132px "Canva Sans Display"', '700 70px "Canva Sans Display"',
    '650 27px "Canva Sans Display"', '600 26px "Canva Sans Display"', '500 31px "Canva Sans Display"'
  ];
  try {
    await Promise.all(want.map(f => document.fonts.load(f, 'خليني أشوفكم Canva 2026')));
    await document.fonts.ready;
  } catch(_){}

  READY = true;
  paintCopy();
  flushDraw();
  document.querySelector('.cap').addEventListener('toggle', e => {
    if (e.target.open) $('#capText').textContent = caption();
  });
  // the copy button lives inside <summary>: copy without toggling the panel
  $('#copyBtn').addEventListener('click', e => e.preventDefault(), true);
})();
</script>
</body>
